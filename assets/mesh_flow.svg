<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 230" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <linearGradient id="nodeRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF4444" />
      <stop offset="100%" stop-color="#DC2626" />
    </linearGradient>
    <linearGradient id="nodeBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <linearGradient id="nodeGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="900" height="230" rx="14" fill="url(#bgGrad)" stroke="#334155" stroke-width="1.5" />

  <!-- Grid Accent Lines -->
  <g opacity="0.06" stroke="#FFFFFF" stroke-width="1">
    <line x1="180" y1="0" x2="180" y2="230" />
    <line x1="360" y1="0" x2="360" y2="230" />
    <line x1="540" y1="0" x2="540" y2="230" />
    <line x1="720" y1="0" x2="720" y2="230" />
  </g>

  <!-- Status Tag -->
  <rect x="25" y="16" width="210" height="24" rx="6" fill="#1E293B" stroke="#475569" stroke-width="1" />
  <circle cx="38" cy="28" r="4" fill="#10B981" />
  <text x="50" y="32" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" letter-spacing="0.6">PHYSICAL P2P MESH PIPELINE</text>

  <!-- Connection Links -->
  <!-- Link 1: A -> B -->
  <path d="M 230 120 L 380 120" stroke="#3B82F6" stroke-width="2.5" stroke-dasharray="6,4" opacity="0.85" />
  <circle cx="305" cy="120" r="4" fill="#3B82F6" filter="url(#glow)" />
  <rect x="260" y="85" width="90" height="20" rx="4" fill="#0B132B" stroke="#3B82F6" stroke-width="1" />
  <text x="305" y="99" text-anchor="middle" fill="#93C5FD" font-family="system-ui, sans-serif" font-size="9.5" font-weight="700">Hop 1 • BLE Adv</text>

  <!-- Link 2: B -> C -->
  <path d="M 520 120 L 670 120" stroke="#10B981" stroke-width="2.5" stroke-dasharray="6,4" opacity="0.85" />
  <circle cx="595" cy="120" r="4" fill="#10B981" filter="url(#glow)" />
  <rect x="550" y="85" width="90" height="20" rx="4" fill="#0B132B" stroke="#10B981" stroke-width="1" />
  <text x="595" y="99" text-anchor="middle" fill="#6EE7B7" font-family="system-ui, sans-serif" font-size="9.5" font-weight="700">Hop 2 • Wi-Fi P2P</text>

  <!-- NODE A: CITIZEN -->
  <g transform="translate(90, 65)">
    <rect width="140" height="110" rx="10" fill="#1E293B" stroke="#EF4444" stroke-width="1.8" />
    <circle cx="70" cy="34" r="18" fill="url(#nodeRed)" filter="url(#glow)" />
    <path d="M 65 26 h 10 a 2 2 0 0 1 2 2 v 12 a 2 2 0 0 1 -2 2 h -10 a 2 2 0 0 1 -2 -2 v -12 a 2 2 0 0 1 2 -2 z" fill="#FFF" />
    <circle cx="70" cy="38" r="1.2" fill="#FFF" />
    <text x="70" y="70" text-anchor="middle" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Citizen (Node A)</text>
    <text x="70" y="86" text-anchor="middle" fill="#F87171" font-family="system-ui, sans-serif" font-size="10" font-weight="600">1-Tap SOS / Direct Chat</text>
    <text x="70" y="100" text-anchor="middle" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="9">sender_id: SH-A01</text>
  </g>

  <!-- NODE B: RELAY + STORE & FORWARD -->
  <g transform="translate(380, 65)">
    <rect width="140" height="110" rx="10" fill="#1E293B" stroke="#3B82F6" stroke-width="1.8" />
    <circle cx="70" cy="34" r="18" fill="url(#nodeBlue)" filter="url(#glow)" />
    <path d="M 65 34 a 5 5 0 1 1 2 3.8 M 65 34 v -3.5 h -3.5" fill="none" stroke="#FFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    <text x="70" y="70" text-anchor="middle" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Relay (Node B)</text>
    <rect x="18" y="77" width="104" height="16" rx="4" fill="#0F172A" />
    <text x="70" y="89" text-anchor="middle" fill="#38BDF8" font-family="system-ui, sans-serif" font-size="9" font-weight="700">Store &amp; Forward (TTL--)</text>
    <text x="70" y="102" text-anchor="middle" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="9">Buffer Outbox Queue</text>
  </g>

  <!-- NODE C: RESCUE / DESTINATION -->
  <g transform="translate(670, 65)">
    <rect width="140" height="110" rx="10" fill="#1E293B" stroke="#10B981" stroke-width="1.8" />
    <circle cx="70" cy="34" r="18" fill="url(#nodeGreen)" filter="url(#glow)" />
    <path d="M 70 25 L 78 29 v 5 c 0 5 -8 9 -8 9 s -8 -4 -8 -9 v -5 z" fill="#FFF" />
    <text x="70" y="70" text-anchor="middle" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Rescue (Node C)</text>
    <text x="70" y="86" text-anchor="middle" fill="#34D399" font-family="system-ui, sans-serif" font-size="10" font-weight="600">Delivered + GPS Pin</text>
    <text x="70" y="100" text-anchor="middle" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="9">receiver_id: SH-B02</text>
  </g>

  <!-- Bottom Metric Bar -->
  <rect x="150" y="190" width="600" height="24" rx="6" fill="#0F172A" stroke="#334155" stroke-width="1" />
  <text x="450" y="206" text-anchor="middle" fill="#CBD5E1" font-family="system-ui, sans-serif" font-size="10" font-weight="500">
    <tspan fill="#38BDF8" font-weight="700">AES-256 Encrypted</tspan> • <tspan fill="#34D399" font-weight="700">&lt; 150ms Relay Latency</tspan> • <tspan fill="#F59E0B" font-weight="700">Zero Cellular / SIM Needed</tspan> • <tspan fill="#A78BFA" font-weight="700">LRU Deduplication</tspan>
  </text>
</svg>