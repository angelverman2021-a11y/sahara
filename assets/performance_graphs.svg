<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 310" width="100%" height="100%">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EF4444" />
      <stop offset="100%" stop-color="#B91C1C" />
    </linearGradient>
  </defs>

  <!-- Outer Container -->
  <rect width="900" height="310" rx="14" fill="url(#cardBg)" stroke="#334155" stroke-width="1.5" />

  <!-- Header Title -->
  <text x="30" y="32" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" letter-spacing="0.5">SAHARA BENCHMARKS &amp; PERFORMANCE METRICS</text>
  <text x="870" y="32" text-anchor="end" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11" font-weight="500">Empirical P2P Testing (OPPO F21 Pro &amp; Samsung)</text>
  <line x1="30" y1="44" x2="870" y2="44" stroke="#334155" stroke-width="1" />

  <!-- PANEL 1: Network Survivability During Disaster -->
  <g transform="translate(30, 58)">
    <rect width="260" height="230" rx="10" fill="#0B132B" stroke="#1E293B" stroke-width="1" />
    <text x="16" y="24" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700">Network Uptime During Disaster</text>
    <text x="16" y="38" fill="#64748B" font-family="system-ui, sans-serif" font-size="9.5">Grid blackout &amp; tower collapse</text>

    <!-- Chart Axes -->
    <line x1="35" y1="55" x2="35" y2="180" stroke="#334155" stroke-width="1" />
    <line x1="35" y1="180" x2="245" y2="180" stroke="#334155" stroke-width="1" />

    <!-- Y-axis labels -->
    <text x="30" y="60" text-anchor="end" fill="#64748B" font-family="sans-serif" font-size="8.5">100%</text>
    <text x="30" y="120" text-anchor="end" fill="#64748B" font-family="sans-serif" font-size="8.5">50%</text>
    <text x="30" y="183" text-anchor="end" fill="#64748B" font-family="sans-serif" font-size="8.5">0%</text>

    <!-- SAHARA Mesh Line (Stays 100%) -->
    <path d="M 35 65 Q 120 63 240 65" fill="none" stroke="#10B981" stroke-width="2.5" />
    <circle cx="240" cy="65" r="3.5" fill="#10B981" />
    <text x="240" y="55" text-anchor="end" fill="#34D399" font-family="sans-serif" font-size="9" font-weight="700">SAHARA Mesh (100%)</text>

    <!-- 4G/5G Cellular Line (Drops to 0%) -->
    <path d="M 35 65 L 75 75 C 90 120, 110 178, 140 180 L 240 180" fill="none" stroke="#EF4444" stroke-width="2" stroke-dasharray="4,3" />
    <circle cx="140" cy="180" r="3.5" fill="#EF4444" />
    <text x="165" y="172" fill="#F87171" font-family="sans-serif" font-size="9" font-weight="600">Cellular (0% Blackout)</text>

    <!-- X-axis labels -->
    <text x="40" y="195" fill="#64748B" font-family="sans-serif" font-size="8.5">T+0m</text>
    <text x="130" y="195" text-anchor="middle" fill="#64748B" font-family="sans-serif" font-size="8.5">T+15m</text>
    <text x="240" y="195" text-anchor="end" fill="#64748B" font-family="sans-serif" font-size="8.5">T+2h</text>
    <text x="130" y="215" text-anchor="middle" fill="#38BDF8" font-family="sans-serif" font-size="9" font-weight="600">Decentralized • Zero Point of Failure</text>
  </g>

  <!-- PANEL 2: Hop Latency Breakdown -->
  <g transform="translate(320, 58)">
    <rect width="260" height="230" rx="10" fill="#0B132B" stroke="#1E293B" stroke-width="1" />
    <text x="16" y="24" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700">P2P Hop Delivery Latency</text>
    <text x="16" y="38" fill="#64748B" font-family="system-ui, sans-serif" font-size="9.5">Nearby Connections payload time</text>

    <!-- Bar 1: 1 Hop -->
    <text x="16" y="72" fill="#94A3B8" font-family="sans-serif" font-size="9.5" font-weight="600">1 Hop (Direct)</text>
    <rect x="16" y="78" width="65" height="16" rx="4" fill="url(#greenGrad)" />
    <text x="88" y="91" fill="#6EE7B7" font-family="sans-serif" font-size="10" font-weight="700">65 ms</text>

    <!-- Bar 2: 2 Hops -->
    <text x="16" y="114" fill="#94A3B8" font-family="sans-serif" font-size="9.5" font-weight="600">2 Hops (1 Relay)</text>
    <rect x="16" y="120" width="130" height="16" rx="4" fill="url(#blueGrad)" />
    <text x="153" y="133" fill="#93C5FD" font-family="sans-serif" font-size="10" font-weight="700">140 ms</text>

    <!-- Bar 3: 3 Hops -->
    <text x="16" y="156" fill="#94A3B8" font-family="sans-serif" font-size="9.5" font-weight="600">3 Hops (2 Relays)</text>
    <rect x="16" y="162" width="190" height="16" rx="4" fill="url(#blueGrad)" />
    <text x="213" y="175" fill="#93C5FD" font-family="sans-serif" font-size="10" font-weight="700">220 ms</text>

    <!-- Footer Summary -->
    <line x1="16" y1="193" x2="244" y2="193" stroke="#1E293B" stroke-width="1" />
    <text x="130" y="215" text-anchor="middle" fill="#34D399" font-family="sans-serif" font-size="9.5" font-weight="700">⚡ Sub-second across 500m radius</text>
  </g>

  <!-- PANEL 3: Battery Consumption Overhead -->
  <g transform="translate(610, 58)">
    <rect width="260" height="230" rx="10" fill="#0B132B" stroke="#1E293B" stroke-width="1" />
    <text x="16" y="24" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700">Emergency Battery Drain</text>
    <text x="16" y="38" fill="#64748B" font-family="system-ui, sans-serif" font-size="9.5">Hourly drain rate in outage zones</text>

    <!-- Bar: Cellular Tower Searching -->
    <text x="16" y="72" fill="#F87171" font-family="sans-serif" font-size="9.5" font-weight="600">Cellular Searching</text>
    <rect x="16" y="78" width="185" height="20" rx="4" fill="url(#redGrad)" />
    <text x="208" y="93" fill="#FCA5A5" font-family="sans-serif" font-size="11" font-weight="800">18.5% /h</text>
    <text x="16" y="110" fill="#64748B" font-family="sans-serif" font-size="8.5">Phone amps RF to max searching towers</text>

    <!-- Bar: SAHARA Mesh -->
    <text x="16" y="136" fill="#34D399" font-family="sans-serif" font-size="9.5" font-weight="600">SAHARA Mesh Radio</text>
    <rect x="16" y="142" width="32" height="20" rx="4" fill="url(#greenGrad)" />
    <text x="55" y="157" fill="#6EE7B7" font-family="sans-serif" font-size="11" font-weight="800">2.8% /h</text>
    <text x="16" y="174" fill="#64748B" font-family="sans-serif" font-size="8.5">Duty-cycled BLE + on-demand Wi-Fi Direct</text>

    <!-- Footer Summary -->
    <line x1="16" y1="193" x2="244" y2="193" stroke="#1E293B" stroke-width="1" />
    <text x="130" y="215" text-anchor="middle" fill="#10B981" font-family="sans-serif" font-size="9.5" font-weight="700">🔋 85% Less Battery Consumption</text>
  </g>
</svg>