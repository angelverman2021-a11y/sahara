<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="100%" height="100%">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <linearGradient id="redCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#450A0A" />
      <stop offset="100%" stop-color="#1E1B4B" />
    </linearGradient>
    <linearGradient id="blueCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0C4A6E" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="amberCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#451A03" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="greenCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064E3B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
  </defs>

  <!-- Container -->
  <rect width="900" height="240" rx="14" fill="url(#cardBg)" stroke="#334155" stroke-width="1.5" />

  <!-- Title -->
  <text x="30" y="32" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" letter-spacing="0.5">CORE PRODUCT CAPABILITIES (100% OFFLINE)</text>
  <line x1="30" y1="44" x2="870" y2="44" stroke="#334155" stroke-width="1" />

  <!-- Card 1: 1-Tap SOS -->
  <g transform="translate(30, 58)">
    <rect width="195" height="162" rx="10" fill="url(#redCard)" stroke="#EF4444" stroke-width="1.2" />
    <circle cx="35" cy="35" r="16" fill="#EF4444" />
    <path d="M 35 26 v 11 M 35 41 v 2" stroke="#FFF" stroke-width="2.5" stroke-linecap="round" />
    <text x="60" y="40" fill="#FEF2F2" font-family="system-ui, sans-serif" font-size="13" font-weight="700">1-Tap SOS</text>
    <text x="16" y="72" fill="#FECACA" font-family="system-ui, sans-serif" font-size="10.5" font-weight="600">Instant Distress Beacon</text>
    <text x="16" y="92" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="9.5">Floods highest priority packet across all nearby phones with GPS coordinates &amp; battery %.</text>
    <rect x="16" y="132" width="163" height="18" rx="4" fill="#000" opacity="0.5" />
    <text x="97" y="145" text-anchor="middle" fill="#F87171" font-family="sans-serif" font-size="9" font-weight="700">Highest Priority Hop</text>
  </g>

  <!-- Card 2: Real P2P Mesh -->
  <g transform="translate(245, 58)">
    <rect width="195" height="162" rx="10" fill="url(#blueCard)" stroke="#0284C7" stroke-width="1.2" />
    <circle cx="35" cy="35" r="16" fill="#0284C7" />
    <!-- Mesh icon -->
    <circle cx="30" cy="35" r="3" fill="#FFF" />
    <circle cx="42" cy="29" r="3" fill="#FFF" />
    <circle cx="42" cy="41" r="3" fill="#FFF" />
    <line x1="30" y1="35" x2="42" y2="29" stroke="#FFF" stroke-width="1.5" />
    <line x1="30" y1="35" x2="42" y2="41" stroke="#FFF" stroke-width="1.5" />
    <text x="60" y="40" fill="#F0F9FF" font-family="system-ui, sans-serif" font-size="13" font-weight="700">P2P Mesh Chat</text>
    <text x="16" y="72" fill="#BAE6FD" font-family="system-ui, sans-serif" font-size="10.5" font-weight="600">Zero Cellular / Internet</text>
    <text x="16" y="92" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="9.5">Direct device-to-device Wi-Fi Direct &amp; BLE links. Messages hop securely across phones.</text>
    <rect x="16" y="132" width="163" height="18" rx="4" fill="#000" opacity="0.5" />
    <text x="97" y="145" text-anchor="middle" fill="#38BDF8" font-family="sans-serif" font-size="9" font-weight="700">Nearby Connections</text>
  </g>

  <!-- Card 3: Store & Forward -->
  <g transform="translate(460, 58)">
    <rect width="195" height="162" rx="10" fill="url(#amberCard)" stroke="#D97706" stroke-width="1.2" />
    <circle cx="35" cy="35" r="16" fill="#D97706" />
    <!-- Loop icon -->
    <path d="M 31 35 a 4 4 0 1 1 1.5 3.1 M 31 35 v -3 h -3" fill="none" stroke="#FFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    <text x="60" y="40" fill="#FFFBEB" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Store &amp; Forward</text>
    <text x="16" y="72" fill="#FDE68A" font-family="system-ui, sans-serif" font-size="10.5" font-weight="600">Delay-Tolerant Outbox</text>
    <text x="16" y="92" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="9.5">No connection right now? Packets buffer in memory. Delivered automatically when a peer arrives.</text>
    <rect x="16" y="132" width="163" height="18" rx="4" fill="#000" opacity="0.5" />
    <text x="97" y="145" text-anchor="middle" fill="#FBBF24" font-family="sans-serif" font-size="9" font-weight="700">Zero Packet Loss</text>
  </g>

  <!-- Card 4: 10+ Languages -->
  <g transform="translate(675, 58)">
    <rect width="195" height="162" rx="10" fill="url(#greenCard)" stroke="#059669" stroke-width="1.2" />
    <circle cx="35" cy="35" r="16" fill="#059669" />
    <!-- Globe/Language icon -->
    <circle cx="35" cy="35" r="8" fill="none" stroke="#FFF" stroke-width="1.5" />
    <line x1="27" y1="35" x2="43" y2="35" stroke="#FFF" stroke-width="1.5" />
    <ellipse cx="35" cy="35" rx="4" ry="8" fill="none" stroke="#FFF" stroke-width="1.5" />
    <text x="60" y="40" fill="#ECFDF5" font-family="system-ui, sans-serif" font-size="13" font-weight="700">10+ Languages</text>
    <text x="16" y="72" fill="#A7F3D0" font-family="system-ui, sans-serif" font-size="10.5" font-weight="600">Crisis Accessibility</text>
    <text x="16" y="92" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="9.5">Hindi, Odia, Bengali, Telugu, Marathi, Gujarati, Assamese, Malayalam, Maithili, Bodo, English.</text>
    <rect x="16" y="132" width="163" height="18" rx="4" fill="#000" opacity="0.5" />
    <text x="97" y="145" text-anchor="middle" fill="#34D399" font-family="sans-serif" font-size="9" font-weight="700">Emergency Localization</text>
  </g>
</svg>